<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vorschau: Jahreszeiten & Feiertage – Start/Beenden</title>
<style>
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-ext-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF}
@font-face{font-family:'DM Sans';src:url(fonts/dm-sans-latin-wght-normal.woff2) format('woff2');font-weight:100 1000;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dm-sans-latin-ext-wght-normal.woff2) format('woff2');font-weight:100 1000;font-display:swap;unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF}
@font-face{font-family:Unbounded;src:url(fonts/unbounded.woff2) format('woff2');font-weight:200 900;font-display:swap}
@font-face{font-family:Quicksand;src:url(fonts/quicksand.woff2) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'Playfair Display';src:url(fonts/playfair.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'Space Grotesk';src:url(fonts/spacegrotesk.woff2) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrainsmono.woff2) format('woff2');font-weight:100 800;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url(fonts/cormorant.woff2) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'Archivo Black';src:url(fonts/archivoblack.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'Space Mono';src:url(fonts/spacemono.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Space Mono';src:url(fonts/spacemono-bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Manrope;src:url(fonts/manrope.woff2) format('woff2');font-weight:200 800;font-display:swap}
:root{--fh:"Outfit","Segoe UI",system-ui,sans-serif;--fb:"DM Sans","Segoe UI",system-ui,sans-serif}
[data-theme=gold]{--a:#f5b544;--b:#ffdf8a;--bg:#0d0a05;--bg2:#1f1708;--glow:rgba(245,181,68,.4);--muted:#c9b991;--text:#fff7e6;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
[data-theme=neon]{--a:#a46bff;--b:#ff6fc4;--bg:#0b0614;--bg2:#160c26;--glow:rgba(164,107,255,.45);--muted:#b3a6c9;--text:#f6f1ff;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
[data-theme=ocean]{--a:#38bdf8;--b:#22d3ee;--bg:#03101a;--bg2:#06202e;--glow:rgba(56,189,248,.42);--muted:#9cb9c9;--text:#eefaff;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
[data-theme=light]{--a:#7c3aed;--b:#db2777;--bg:#f6f2fb;--bg2:#ece3f8;--glow:rgba(124,58,237,.28);--muted:#5f5374;--text:#1d1430;--panel:rgba(30,10,60,.05);--line:rgba(30,10,60,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--fb)}
body{display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--line);position:relative;z-index:5}
.bar b{font:800 13px var(--fh);margin-right:4px;color:var(--muted);letter-spacing:.04em}
.bar button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:6px 11px;font:600 12.5px var(--fb);cursor:pointer;white-space:nowrap}
.bar button.on{background:linear-gradient(110deg,var(--a),var(--b));color:#140d02;border-color:transparent;box-shadow:0 3px 12px var(--glow)}
[data-theme=light] .bar button.on,[data-theme=neon] .bar button.on{color:#fff}
.sep{flex-basis:100%;height:0}
.stage{position:relative;flex:1;min-height:420px;overflow:hidden;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(60% 60% at 50% 42%,var(--tint,var(--bg2)),var(--bg))}
.orbs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:orb 14s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:42vmax;height:42vmax;left:-12vmax;top:-10vmax;background:var(--o1,var(--a))}
.orbs i:nth-child(2){width:36vmax;height:36vmax;right:-10vmax;bottom:-12vmax;background:var(--o2,var(--b));animation-delay:-5s}
@keyframes orb{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.center{position:relative;z-index:2}
.logo{position:relative;width:140px;height:140px;margin:0 auto 22px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,conic-gradient(from 0deg,var(--a),var(--b),transparent 70%,var(--a)) border-box;animation:spin 6s linear infinite;box-shadow:0 0 50px var(--glow)}
.ring.r2{inset:16px;animation-duration:9s;animation-direction:reverse;opacity:.8;box-shadow:none}
.ring.r3{inset:32px;animation-duration:4s;opacity:.6;box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
.emb{position:relative;font-size:44px;line-height:1;filter:drop-shadow(0 4px 14px var(--glow));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.06)}}
.kicker{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.title{margin:0;font:900 clamp(32px,6.5vw,72px)/1.02 var(--fh);background:linear-gradient(100deg,#fff 10%,var(--b) 50%,var(--a) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
[data-theme=light] .title{background-image:linear-gradient(100deg,var(--text) 10%,var(--b) 50%,var(--a) 90%)}
@keyframes shine{50%{background-position:100% 0}}
.ai{background:linear-gradient(110deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:14px 0 0;font-size:clamp(15px,2.2vw,19px);color:var(--muted)}
.when{margin:22px auto 0;display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--panel)}
.rise{animation:rise .9s both}.rise2{animation:rise .9s .15s both}.rise3{animation:rise .9s .3s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.wreath{position:relative;width:140px;height:140px}
</style>
</head>
<body data-theme="gold">
<div class="bar" id="bar"></div>
<div class="stage" id="stage">
  <div class="orbs"><i></i><i></i></div>
  <canvas id="cv"></canvas>
  <div class="center" id="center"></div>
</div>
<script>
const $=s=>document.querySelector(s);
// Ostersonntag (Gauß) – wird jedes Jahr automatisch berechnet
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const fmt=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'long'});
const Y=new Date().getFullYear(),OST=easter(Y),add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const adv4=(()=>{const x=new Date(Y,11,24);const back=x.getDay()===0?7:x.getDay();return add(x,-back)})();
const muttertag=(()=>{const d=new Date(Y,4,1);return add(d,(7-d.getDay())%7+7)})();

const S={
 fruehling:{n:'🌸 Frühling',emb:'🌸',k:'Willkommen im',tag:'Frischer Wind für deine Videos.',bye:'Schönen Frühling!',when:'März – Mai',fx:'petals',o1:'#ff9ccf',o2:'#9be37a'},
 sommer:{n:'☀️ Sommer',emb:'☀️',k:'Willkommen im',tag:'Heiße Bilder, kleine Dateien.',bye:'Schönen Sommer!',when:'Juni – August',fx:'sun',o1:'#ffb03a',o2:'#ffe27a'},
 herbst:{n:'🍂 Herbst',emb:'🍁',k:'Willkommen im',tag:'Zeit, die Filmsammlung aufzuräumen.',bye:'Schönen Herbst!',when:'September – November',fx:'leaves',o1:'#e0632a',o2:'#c9a227'},
 winter:{n:'❄️ Winter',emb:'❄️',k:'Willkommen im',tag:'Gemütlich umwandeln, während es draußen schneit.',bye:'Bleib schön warm!',when:'Dezember – Februar',fx:'snow',o1:'#7cc4ff',o2:'#c9e6ff'},
 silvester:{n:'🎆 Silvester',emb:'🥂',k:'Frohes neues Jahr!',tag:`Willkommen in ${Y+1} – auf viele gute Filme.`,bye:'Guten Rutsch!',when:'31. Dezember – 1. Januar',fx:'fireworks'},
 fasching:{n:'🎭 Fasching',emb:'🎭',k:'Helau & Alaaf!',tag:'Konfetti für deine Videos.',bye:'Helau & bis bald!',when:'Weiberfastnacht – Aschermittwoch',fx:'confetti'},
 ostern:{n:'🐣 Ostern',emb:'🐣',k:'Frohe Ostern!',tag:'Mal sehen, welche Eier im Ordner versteckt sind.',bye:'Frohe Ostern!',when:`Karfreitag – Ostermontag (${Y}: ${fmt(add(OST,-2))} – ${fmt(add(OST,1))})`,fx:'easter',o1:'#a7e27b',o2:'#ffd36e'},
 muttertag:{n:'💐 Muttertag',emb:'💐',k:'Alles Liebe zum Muttertag',tag:'Ein Gruß an alle Mamas.',bye:'Schönen Muttertag!',when:`2. Sonntag im Mai (${Y}: ${fmt(muttertag)})`,fx:'hearts',o1:'#ff7aa8',o2:'#ffc1d6'},
 vatertag:{n:'🍺 Vatertag',emb:'🍺',k:'Schönen Vatertag!',tag:'Heute rendert der Rechner, Papa macht Pause.',bye:'Prost & schönen Vatertag!',when:`Christi Himmelfahrt (${Y}: ${fmt(add(OST,39))})`,fx:'bubbles',o1:'#f0b429',o2:'#fff3c4'},
 halloween:{n:'🎃 Halloween',emb:'🎃',k:'Süßes oder Saures!',tag:'Gruselig gute Bildqualität.',bye:'Schaurig schönen Abend!',when:'31. Oktober',fx:'halloween',o1:'#ff7a1a',o2:'#6b21a8',tint:'#1a0a20'},
 advent:{n:'🕯 Advent',emb:'wreath',k:'Schönen 2. Advent',tag:'Eine Kerze mehr an jedem Sonntag.',bye:'Besinnliche Adventszeit!',when:`Adventssonntage (${Y}: ab ${fmt(add(adv4,-21))})`,fx:'snowsoft',o1:'#d4a017',o2:'#b91c1c'},
 nikolaus:{n:'🎅 Nikolaus',emb:'🎅',k:'Hohoho – Nikolaus!',tag:'Hast du deine Stiefel geputzt?',bye:'Schönen Nikolaustag!',when:'6. Dezember',fx:'sweets',o1:'#dc2626',o2:'#fde68a'},
 weihnachten:{n:'🎄 Weihnachten',emb:'🎄',k:'Frohe Weihnachten!',tag:'Und ein paar ruhige Tage mit guten Filmen.',bye:'Frohe Weihnachten!',when:'24. – 26. Dezember',fx:'xmas',o1:'#16a34a',o2:'#dc2626'},
 geburtstag:{n:'🎂 Geburtstag',emb:'🎂',k:'Alles Gute zum Geburtstag!',tag:'Heute läuft alles ein bisschen festlicher.',bye:'Feier schön!',when:'Dein Datum (in den Einstellungen eintragen)',fx:'balloons'}
};
let cur='weihnachten',mode='start',theme='gold';
function today(){const d=new Date(),m=d.getMonth()+1,dd=d.getDate(),t=new Date(Y,m-1,dd);
  if((m===12&&dd===31)||(m===1&&dd===1))return 'silvester';
  if(m===12&&dd>=24&&dd<=26)return 'weihnachten';if(m===12&&dd===6)return 'nikolaus';if(m===10&&dd===31)return 'halloween';
  const o=OST;if(t>=add(o,-2)&&t<=add(o,1))return 'ostern';if(+t===+add(o,39))return 'vatertag';if(+t===+muttertag)return 'muttertag';
  if(t>=add(o,-52)&&t<=add(o,-46))return 'fasching';if(t>=add(adv4,-21)&&t<new Date(Y,11,24)&&t.getDay()===0)return 'advent';
  return m>=3&&m<=5?'fruehling':m>=6&&m<=8?'sommer':m>=9&&m<=11?'herbst':'winter'}
const AUTO=today();

function bar(){const b=$('#bar');
  b.innerHTML=`<b>ANSICHT</b>${[['start','▶ Start'],['bye','⏻ Beenden']].map(([k,t])=>`<button data-m="${k}" class="${mode===k?'on':''}">${t}</button>`).join('')}
   <b style="margin-left:10px">DESIGN</b>${[['gold','Gold'],['neon','Neon'],['ocean','Ozean'],['light','Hell']].map(([k,t])=>`<button data-t="${k}" class="${theme===k?'on':''}">${t}</button>`).join('')}
   <span class="sep"></span><b>SZENE</b>${Object.entries(S).map(([k,v])=>`<button data-s="${k}" class="${cur===k?'on':''}">${v.n}${k===AUTO?' · heute':''}</button>`).join('')}`;
  b.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{cur=x.dataset.s;show()});
  b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{mode=x.dataset.m;show()});
  b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{theme=x.dataset.t;document.body.dataset.theme=theme;show()});}
function wreath(n){const c=[0,1,2,3].map(i=>{const x=34+i*24,lit=i<n;return `<g transform="translate(${x},44)"><rect x="-6" y="0" width="12" height="34" rx="3" fill="${['#b91c1c','#7c3aed','#b91c1c','#7c3aed'][i]}"/>${lit?`<ellipse cx="0" cy="-8" rx="5" ry="10" fill="#ffd27a"><animate attributeName="ry" values="10;8;11;10" dur="${.8+i*.13}s" repeatCount="indefinite"/></ellipse><ellipse cx="0" cy="-5" rx="2.4" ry="5" fill="#fff6d8"/>`:''}</g>`}).join('');
  return `<svg class="wreath" viewBox="0 0 140 140"><ellipse cx="70" cy="96" rx="62" ry="20" fill="#14532d"/><ellipse cx="70" cy="92" rx="58" ry="15" fill="#166534"/>${[20,45,70,95,120].map((x,i)=>`<circle cx="${x}" cy="${98+(i%2)*4}" r="5" fill="#dc2626"/>`).join('')}${c}</svg>`}
function show(){const s=S[cur],st=$('#stage');
  st.style.setProperty('--o1',s.o1||'var(--a)');st.style.setProperty('--o2',s.o2||'var(--b)');st.style.setProperty('--tint',s.tint||'var(--bg2)');
  const emb=s.emb==='wreath'?wreath(2):`<div class="emb">${s.emb}</div>`;
  $('#center').innerHTML=mode==='start'
   ?`<div class="logo rise">${s.emb==='wreath'?emb:`<span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>${emb}`}</div>
     <p class="kicker rise2">${s.k}</p><h1 class="title rise2">Butchies Video Converter <span class="ai">AI</span></h1><p class="tag rise3">${s.tag}</p><span class="when rise3">📅 ${s.when}</span>`
   :`<div class="logo rise">${s.emb==='wreath'?emb:`<span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>${emb}`}</div>
     <p class="kicker rise2">Danke fürs Umwandeln</p><h1 class="title rise2" style="font-size:clamp(40px,9vw,104px)">${s.bye}</h1><p class="tag rise3">Butchies Video Converter <span class="ai">AI</span></p><span class="when rise3">📅 ${s.when}</span>`;
  bar();fx.start(s.fx)}

/* ---------- Effekte (Canvas) ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
function size(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const fx={P:[],kind:'',t:0,
 start(k){this.kind=k;this.P=[];this.t=0;size();const n={petals:45,sun:60,leaves:34,snow:140,snowsoft:70,confetti:150,easter:26,hearts:30,bubbles:60,halloween:16,sweets:30,xmas:110,balloons:22,fireworks:0}[k]||0;
   for(let i=0;i<n;i++)this.P.push(this.mk(true))},
 mk(init){const k=this.kind,p={x:R(0,W),y:init?R(-H,H):-30,r:R(0,6.28),vr:R(-.03,.03),s:R(.6,1.4),ph:R(0,6.28)};
   if(k==='snow'||k==='xmas'||k==='snowsoft'){p.vy=R(.4,1.4);p.rad=R(1.2,3.6);p.vx=R(-.3,.3)}
   if(k==='petals'){p.vy=R(.6,1.4);p.vx=R(.4,1.2);p.c=pick(['#ffb7d5','#ff9ccf','#ffd1e6','#fff0f6'])}
   if(k==='leaves'){p.vy=R(.7,1.6);p.vx=R(-.4,.4);p.e=pick(['🍂','🍁','🍁','🍂','🌰']);p.fs=R(18,30)}
   if(k==='sun'){p.y=init?R(0,H):H+10;p.vy=-R(.2,.6);p.rad=R(1,3);p.vx=R(-.2,.2)}
   if(k==='confetti'){p.vy=R(1,2.6);p.vx=R(-.8,.8);p.c=pick(['#ff4d6d','#ffd60a','#06d6a0','#4cc9f0','#b5179e','#f77f00']);p.w=R(5,10);p.h=R(3,6)}
   if(k==='easter'){p.y=init?R(0,H):H+40;p.vy=-R(.35,.8);p.e=pick(['🥚','🐣','🌷','🐰','🥚','🌼']);p.fs=R(20,34);p.vx=R(-.2,.2)}
   if(k==='hearts'){p.y=init?R(0,H):H+40;p.vy=-R(.4,1);p.e=pick(['💖','🌷','💐','💕','🌸']);p.fs=R(16,30);p.vx=R(-.2,.2)}
   if(k==='bubbles'){p.y=init?R(0,H):H+10;p.vy=-R(.5,1.4);p.rad=R(2,6);p.vx=R(-.2,.2)}
   if(k==='halloween'){p.y=R(20,H*.6);p.x=init?R(0,W):-40;p.vx=R(.8,2);p.vy=0;p.e=pick(['🦇','🦇','🦇','👻']);p.fs=R(18,34)}
   if(k==='sweets'){p.vy=R(.6,1.4);p.vx=R(-.3,.3);p.e=pick(['🍫','🍬','🍪','🥜','🍊','⭐']);p.fs=R(16,28)}
   if(k==='balloons'){p.y=init?R(0,H):H+60;p.vy=-R(.6,1.3);p.c=pick(['#ff4d6d','#ffd60a','#06d6a0','#4cc9f0','#b5179e']);p.rad=R(16,26);p.vx=R(-.2,.2)}
   return p},
 frame(){const k=this.kind;this.t++;cx.clearRect(0,0,W,H);
   if(k==='sun'){const g=cx.createRadialGradient(W*.82,H*.12,0,W*.82,H*.12,Math.max(W,H)*.7);g.addColorStop(0,'rgba(255,214,110,.55)');g.addColorStop(.3,'rgba(255,170,60,.12)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
     cx.save();cx.translate(W*.82,H*.12);cx.rotate(this.t*.0015);for(let i=0;i<14;i++){cx.rotate(Math.PI*2/14);cx.fillStyle='rgba(255,220,130,.07)';cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.max(W,H),-40);cx.lineTo(Math.max(W,H),40);cx.fill()}cx.restore()}
   if(k==='halloween'){cx.font='54px serif';cx.globalAlpha=.9;for(let i=0;i<5;i++){cx.fillText('🎃',W*(.06+i*.22),H-18+Math.sin(this.t*.03+i)*3)}cx.globalAlpha=1;
     const m=cx.createRadialGradient(W*.15,H*.18,0,W*.15,H*.18,70);m.addColorStop(0,'rgba(255,240,200,.9)');m.addColorStop(.5,'rgba(255,200,120,.25)');m.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=m;cx.fillRect(0,0,W,H)}
   if(k==='xmas'){cx.font='70px serif';cx.fillText('🎄',W*.08,H-20);cx.fillText('🎁',W*.08+70,H-16);cx.font='60px serif';cx.fillText('🎄',W*.84,H-20);
     for(let i=0;i<26;i++){const x=(i*137.5)%W,y=(i*71)%(H*.45),a=.4+.6*Math.abs(Math.sin(this.t*.04+i));cx.fillStyle=`rgba(255,240,180,${a})`;cx.beginPath();cx.arc(x,y,1.6,0,7);cx.fill()}}
   if(k==='fireworks'){if(this.t%28===0||this.P.length<8&&this.t%9===0){const x=R(W*.1,W*.9),y=R(H*.1,H*.5),c=pick(['#ffd60a','#ff4d6d','#4cc9f0','#06d6a0','#f77f00','#ffffff','#c77dff']);for(let i=0;i<70;i++){const a=R(0,6.28),v=R(1,4.2);this.P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:R(50,90),c})}}
     cx.globalCompositeOperation='lighter';this.P=this.P.filter(p=>p.life-->0);for(const p of this.P){p.vy+=.035;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;cx.globalAlpha=Math.min(1,p.life/40);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,1.8,0,7);cx.fill()}cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
     requestAnimationFrame(()=>this.frame());return}
   for(const p of this.P){p.ph+=.02;p.r+=p.vr;
     p.x+=(p.vx||0)+(['petals','leaves','snow','xmas','snowsoft','confetti','sweets'].includes(k)?Math.sin(p.ph)*.6:0);p.y+=p.vy||0;
     if(p.y>H+40||p.y<-80||p.x>W+60||p.x<-60){Object.assign(p,this.mk(false));if(k==='halloween')p.x=-40}
     cx.save();cx.translate(p.x,p.y);
     if(k==='snow'||k==='xmas'||k==='snowsoft'){cx.fillStyle=document.body.dataset.theme==='light'?'rgba(120,150,200,.8)':'rgba(255,255,255,.85)';cx.beginPath();cx.arc(0,0,p.rad,0,7);cx.fill()}
     else if(k==='petals'){cx.rotate(p.r);cx.fillStyle=p.c;cx.beginPath();cx.ellipse(0,0,7*p.s,4*p.s,0,0,7);cx.fill()}
     else if(k==='sun'){cx.fillStyle='rgba(255,226,140,.7)';cx.beginPath();cx.arc(0,0,p.rad,0,7);cx.fill()}
     else if(k==='bubbles'){cx.strokeStyle='rgba(255,236,170,.75)';cx.lineWidth=1.2;cx.beginPath();cx.arc(0,0,p.rad,0,7);cx.stroke()}
     else if(k==='confetti'){cx.rotate(p.r*3);cx.scale(1,Math.abs(Math.sin(p.ph*2)));cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
     else if(k==='balloons'){cx.strokeStyle='rgba(200,200,200,.5)';cx.beginPath();cx.moveTo(0,p.rad);cx.quadraticCurveTo(6,p.rad+20,0,p.rad+40);cx.stroke();cx.fillStyle=p.c;cx.globalAlpha=.85;cx.beginPath();cx.ellipse(0,0,p.rad*.82,p.rad,0,0,7);cx.fill();cx.globalAlpha=.35;cx.fillStyle='#fff';cx.beginPath();cx.ellipse(-p.rad*.3,-p.rad*.35,p.rad*.18,p.rad*.28,-.5,0,7);cx.fill()}
     else{cx.rotate(k==='halloween'?Math.sin(p.ph*4)*.2:Math.sin(p.ph)*.4);cx.font=p.fs+'px serif';cx.textAlign='center';cx.fillText(p.e,0,0)}
     cx.restore()}
   if(k==='confetti'||k==='balloons'){/* Luftschlangen */}
   requestAnimationFrame(()=>this.frame())}};
cur=AUTO;bar();show();fx.frame();
