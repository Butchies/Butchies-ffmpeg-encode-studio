<script>
const $=s=>document.querySelector(s);const SP=$('#splash').outerHTML;
function leave(){const sp=$('#splash');if(sp)sp.classList.add('leave')}
$('#splash').onclick=leave;setTimeout(leave,3400);
function replaySplash(){const o=$('#splash');if(o)o.remove();document.body.insertAdjacentHTML('afterbegin',SP);$('#splash').onclick=leave;setTimeout(leave,3400)}
