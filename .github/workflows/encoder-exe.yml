name: ffmpeg_encode Studio – Windows-Installer

# Baut auf einem echten Windows-Rechner von GitHub: Programm (PyInstaller) + FFmpeg mit allen Codecs
# + WebView2-Installer -> testet das fertige Programm mit echten Videos + KI-Test -> Inno-Setup-Installer -> Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Programm bauen (PyInstaller)
        run: |
          python -m pip install --upgrade pip pyinstaller pywebview numpy opencv-python-headless
          # KI läuft über DirectML auf jeder Grafikkarte (NVIDIA, AMD, Intel), sonst auf dem Prozessor
          python -m pip install onnxruntime-directml
          if ($LASTEXITCODE -ne 0) { python -m pip install onnxruntime }
          python -c "import onnxruntime as o, cv2, numpy; print('onnxruntime', o.__version__, o.get_available_providers(), 'opencv', cv2.__version__)" | Tee-Object -FilePath build.log
          python -m PyInstaller --onedir --noconsole --noconfirm --name ffmpeg_encode_Studio --icon icon.ico `
            --add-data "ui;ui" --collect-all webview --hidden-import clr --hidden-import mark --hidden-import viz `
            --collect-all onnxruntime --collect-submodules cv2 ffmpeg_encode_studio.py 2>&1 | Tee-Object -FilePath build.log -Append
          if (!(Test-Path dist\ffmpeg_encode_Studio\ffmpeg_encode_Studio.exe)) { exit 1 }

      - name: KI-Modell holen (MobileSAM, MIT-Lizenz, offline nutzbar)
        run: |
          New-Item -ItemType Directory -Force dist\ffmpeg_encode_Studio\models | Out-Null
          foreach ($f in 'mobile_sam_image_encoder.onnx', 'sam_mask_decoder_single.onnx') {
            Invoke-WebRequest -UseBasicParsing "https://huggingface.co/Acly/MobileSAM/resolve/main/$f" -OutFile "dist\ffmpeg_encode_Studio\models\$f"
            "$f : $((Get-Item dist\ffmpeg_encode_Studio\models\$f).Length) Bytes" | Tee-Object -FilePath model.log -Append
          }
          "MobileSAM (https://github.com/ChaoningZhang/MobileSAM), ONNX-Export: https://huggingface.co/Acly/MobileSAM - MIT-Lizenz" | Out-File -Encoding utf8 dist\ffmpeg_encode_Studio\models\LIZENZ.txt

      - name: FFmpeg mit allen Codecs holen (x264, x265, AAC, NVENC, Quick Sync, AMF)
        run: |
          $urls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip')
          $ok = $false
          foreach ($u in $urls) { try { Invoke-WebRequest -UseBasicParsing $u -OutFile ff.zip; $ok = $true; "FFmpeg von $u" | Tee-Object -FilePath ffmpeg.log; break } catch { "nicht gefunden: $u" } }
          if (-not $ok) { exit 1 }
          Expand-Archive ff.zip -DestinationPath fftmp
          $d = Get-ChildItem fftmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Move-Item "$($d.FullName)\bin" ffmpeg\bin
          Copy-Item "$($d.FullName)\LICENSE.txt" ffmpeg\LICENSE.txt -ErrorAction SilentlyContinue
          & ffmpeg\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1 | Tee-Object -FilePath ffmpeg.log -Append
          & ffmpeg\bin\ffmpeg.exe -hide_banner -encoders | Select-String 'libx264|libx265|nvenc|qsv|amf| aac ' | Tee-Object -FilePath ffmpeg.log -Append

      - name: WebView2-Installer holen
        run: Invoke-WebRequest -UseBasicParsing 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile MicrosoftEdgeWebview2Setup.exe

      - name: Echter Test – Programm starten, Videos konvertieren, KI-Auswahl + Markierungen prüfen
        run: |
          Copy-Item -Recurse ffmpeg dist\ffmpeg_encode_Studio\ffmpeg
          $exe = (Resolve-Path dist\ffmpeg_encode_Studio\ffmpeg_encode_Studio.exe).Path
          ./tools/smoke.ps1 -Exe $exe -Out smoke.log
          $n = Start-Process -FilePath $exe -ArgumentList '--check-native' -PassThru -Wait -RedirectStandardOutput native.txt -RedirectStandardError native-err.txt
          Get-Content native.txt, native-err.txt | Tee-Object -FilePath smoke.log -Append
          if (!(Select-String -Path native.txt -Pattern 'native ok' -Quiet)) { exit 1 }
          Remove-Item -Recurse -Force dist\ffmpeg_encode_Studio\ffmpeg

      - name: Installer bauen (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path ffmpeg_encode_studio.py -Pattern "^VERSION = '([^']+)'").Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" installer.iss 2>&1 | Tee-Object -FilePath installer.log
          if (!(Test-Path dist\ffmpeg_encode_Studio-Setup.exe)) { exit 1 }
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "encoder-v$env:VER"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag dist\ffmpeg_encode_Studio-Setup.exe --clobber }
          else { gh release create $tag dist\ffmpeg_encode_Studio-Setup.exe --title "ffmpeg_encode Studio $env:VER" --notes-file RELEASE.md --latest=false --target $env:GITHUB_SHA }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg_encode_Studio
          path: |
            dist/ffmpeg_encode_Studio-Setup.exe
            *.log
