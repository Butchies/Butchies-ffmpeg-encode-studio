name: Butchies Video Converter – Windows-Installer

# Eigenständiges Programm im Ordner video-converter/ (hat mit dem ffmpeg_encode Studio nichts zu tun).
# Baut auf einem echten Windows-Rechner von GitHub: Programm (PyInstaller) + FFmpeg mit allen Codecs (inkl. libvmaf, zimg)
# + WebView2-Installer -> Selbsttest mit echten Videos -> Inno-Setup-Installer -> Release "converter-v<VERSION>".
on:
  push:
    branches: [main]
    paths:
      - 'video-converter/**'
      - '.github/workflows/converter-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: video-converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Programm bauen (PyInstaller)
        run: |
          python -m pip install --upgrade pip pyinstaller pywebview
          python -m PyInstaller --onedir --noconsole --noconfirm --name Butchies_Video_Converter --icon converter.ico `
            --add-data "ui;ui" --collect-all webview --hidden-import clr butchies_video_converter.py 2>&1 | Tee-Object -FilePath build.log
          if (!(Test-Path dist\Butchies_Video_Converter\Butchies_Video_Converter.exe)) { exit 1 }

      - name: FFmpeg mit allen Codecs holen (x264, x265, AAC, NVENC, Quick Sync, AMF, VMAF, zimg)
        run: |
          $urls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip')
          $ok = $false
          foreach ($u in $urls) { try { Invoke-WebRequest -UseBasicParsing $u -OutFile ff.zip; $ok = $true; "FFmpeg von $u" | Tee-Object -FilePath ffmpeg.log; break } catch { "nicht gefunden: $u" } }
          if (-not $ok) { exit 1 }
          Expand-Archive ff.zip -DestinationPath fftmp
          $d = Get-ChildItem fftmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Move-Item "$($d.FullName)\bin" ffmpeg\bin
          Copy-Item "$($d.FullName)\LICENSE.txt" ffmpeg\LICENSE.txt -ErrorAction SilentlyContinue
          & ffmpeg\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1 | Tee-Object -FilePath ffmpeg.log -Append
          & ffmpeg\bin\ffmpeg.exe -hide_banner -filters | Select-String 'libvmaf|zscale|tonemap' | Tee-Object -FilePath ffmpeg.log -Append

      - name: WebView2-Installer holen
        run: Invoke-WebRequest -UseBasicParsing 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile MicrosoftEdgeWebview2Setup.exe

      - name: Echter Test – Videos prüfen, umwandeln, VMAF messen, HDR, Player-Stream, Ordner-Abgleich
        run: |
          Copy-Item -Recurse ffmpeg dist\Butchies_Video_Converter\ffmpeg
          $exe = (Resolve-Path dist\Butchies_Video_Converter\Butchies_Video_Converter.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt, selftest-err.txt | Tee-Object -FilePath selftest.log
          if (!(Select-String -Path selftest.txt -Pattern 'selftest ok' -Quiet)) { exit 1 }
          $n = Start-Process -FilePath $exe -ArgumentList '--check-native' -PassThru -Wait -RedirectStandardOutput native.txt -RedirectStandardError native-err.txt
          Get-Content native.txt, native-err.txt | Tee-Object -FilePath selftest.log -Append
          if (!(Select-String -Path native.txt -Pattern 'native ok' -Quiet)) { exit 1 }
          Remove-Item -Recurse -Force dist\Butchies_Video_Converter\ffmpeg

      - name: Installer bauen (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path butchies_video_converter.py -Pattern "^VERSION = '([^']+)'").Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" installer.iss 2>&1 | Tee-Object -FilePath installer.log
          if (!(Test-Path dist\Butchies_Video_Converter-Setup.exe)) { exit 1 }
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "converter-v$env:VER"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag dist\Butchies_Video_Converter-Setup.exe --clobber }
          else { gh release create $tag dist\Butchies_Video_Converter-Setup.exe --title "Butchies Video Converter $env:VER" --notes-file RELEASE.md --latest=false --target $env:GITHUB_SHA }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Butchies_Video_Converter
          path: |
            video-converter/dist/Butchies_Video_Converter-Setup.exe
            video-converter/*.log
