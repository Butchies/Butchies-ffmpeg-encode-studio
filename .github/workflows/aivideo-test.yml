name: KI-Video – Echttest mit echtem Modell

# Lädt das KI-Video-Paket wie beim Nutzer (Hugging Face), rechnet winzige Stücke mit dem echten Modell
# auf dem Prozessor (GitHub hat keine Grafikkarte) und prüft das Ergebnis. Bilder/Videos als Artefakt.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aivideo.py'
      - 'tools/aivideo_test.py'
      - '.github/workflows/aivideo-test.yml'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install numpy opencv-python-headless
          gh release download -R leejet/stable-diffusion.cpp --pattern "*-bin-win-vulkan-x64.zip" -O sdcpp.zip --clobber
          Expand-Archive sdcpp.zip -DestinationPath sdcpp -Force
          (gh release view -R leejet/stable-diffusion.cpp --json tagName -q .tagName)
          Invoke-WebRequest -UseBasicParsing 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip' -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp -Force
          $global:LASTEXITCODE = 0
      - name: Modell-Zwischenspeicher
        id: mcache
        uses: actions/cache/restore@v4
        with:
          path: aitest/home/aivideo/models
          key: wan22-ti2v5b-turbo-q4km-v1
      - name: KI-Paket laden (wie beim Nutzer)
        run: |
          $cli = (Get-ChildItem sdcpp -Recurse -Filter sd-cli.exe | Select-Object -First 1).FullName
          $ff = (Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          python tools/aivideo_test.py $cli $ff aitest --download-only
      - name: Modell zwischenspeichern
        if: steps.mcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: aitest/home/aivideo/models
          key: wan22-ti2v5b-turbo-q4km-v1
      - name: Echtes Modell testen
        run: |
          $cli = (Get-ChildItem sdcpp -Recurse -Filter sd-cli.exe | Select-Object -First 1).FullName
          $ff = (Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          python tools/aivideo_test.py $cli $ff aitest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ki-video-test
          path: |
            aitest/*.png
            aitest/*.mp4
            aitest/*.txt
            aitest/home/aivideo/jobs/**/*.log
