name: KI-Video – Echttest mit echtem Modell

# Lädt das KI-Video-Paket wie beim Nutzer (Hugging Face), rechnet winzige Stücke mit dem echten Modell
# auf dem Prozessor (GitHub hat keine Grafikkarte) und prüft das Ergebnis. Bilder/Videos als Artefakt.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aivideo.py'
      - 'tools/aivideo_test.py'
      - 'tools/make_upscaler.py'
      - 'upscale.py'
      - 'hwinfo.py'
      - '.github/workflows/aivideo-test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install numpy opencv-python-headless onnxruntime
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx
          Invoke-WebRequest -UseBasicParsing 'https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth' -OutFile realesr-general-x4v3.pth
          New-Item -ItemType Directory -Force upmodels | Out-Null
          python tools/make_upscaler.py realesr-general-x4v3.pth upmodels\realesr-general-x4v3.onnx
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release download master-1117-0d71f96 -R leejet/stable-diffusion.cpp --pattern "*-bin-win-vulkan-x64.zip" -O sdcpp.zip --clobber
          Expand-Archive sdcpp.zip -DestinationPath sdcpp -Force
          'sd.cpp master-1117-0d71f96'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip' -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp -Force
          $global:LASTEXITCODE = 0
      - name: Modell-Zwischenspeicher
        id: mcache
        uses: actions/cache/restore@v4
        with:
          path: aitest/home/aivideo/models
          key: wan22-ti2v5b-turbo-q4km-v1
      - name: KI-Paket laden (wie beim Nutzer)
        run: |
          $cli = (Get-ChildItem sdcpp -Recurse -Filter sd-cli.exe | Select-Object -First 1).FullName
          $ff = (Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          python tools/aivideo_test.py $cli $ff aitest --download-only
      - name: Modell zwischenspeichern
        if: steps.mcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: aitest/home/aivideo/models
          key: wan22-ti2v5b-turbo-q4km-v1
      - name: Echtes Modell testen
        run: |
          $cli = (Get-ChildItem sdcpp -Recurse -Filter sd-cli.exe | Select-Object -First 1).FullName
          $ff = (Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          python tools/aivideo_test.py $cli $ff aitest --quality --upscaler upmodels
      - name: Bilder zum Anschauen in Zweig ki-video-test legen
        if: always()
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git checkout --orphan ki-video-test
          git rm -rf --cached . | Out-Null
          New-Item -ItemType Directory -Force kitest | Out-Null
          Copy-Item aitest\*.png, aitest\*.txt kitest -ErrorAction SilentlyContinue
          git add -f kitest
          git commit -m "KI-Video-Testbilder $env:GITHUB_RUN_ID" | Out-Null
          git push -f origin HEAD:ki-video-test
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ki-video-test
          path: |
            aitest/*.png
            aitest/*.mp4
            aitest/*.txt
            aitest/home/aivideo/jobs/**/*.log
